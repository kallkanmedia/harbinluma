<!doctype html>
<html lang="sq">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2e6d2" />
  <meta name="description" content="Harbin & Mazes wedding invitation - 07.08.2026" />
  <title>Harbin & Mazes — Wedding Invitation</title>
  <link rel="preload" as="image" href="assets/cover.webp" />
  <link rel="preload" as="image" href="assets/invitation.webp" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="mobile-invite" id="app">
    <!-- 2. sayfa arkada hazır bekler; zarf tıklanınca görünür. -->
    <section class="invitation-page" id="invitation" aria-label="Harbin and Mazes wedding invitation">
      <div class="art-wrap">
        <picture>
          <source srcset="assets/invitation.webp" type="image/webp" />
          <img src="assets/invitation.png" alt="Harbin and Mazes wedding invitation details and location" class="art-image" draggable="false" />
        </picture>

        <!-- Harita / konum alanı için görünmez ama tıklanabilir link. -->
        <a
          class="map-hotspot map-card-hotspot"
          href="https://maps.app.goo.gl/3RNfRZ366apm3aKt8?g_st=aw"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open wedding location in Google Maps"
        ></a>
        <a
          class="map-hotspot map-button-hotspot"
          href="https://maps.app.goo.gl/3RNfRZ366apm3aKt8?g_st=aw"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Open wedding location in Google Maps"
        ></a>
      </div>
    </section>

    <!-- 1. sayfa: gerçek zarf hissi / açılış ekranı. -->
    <section class="cover-page" id="cover" role="button" tabindex="0" aria-label="Tap to open the wedding invitation">
      <picture>
        <source srcset="assets/cover.webp" type="image/webp" />
        <img src="assets/cover.png" alt="Luxury wedding envelope. Tap to open." class="cover-image" draggable="false" />
      </picture>
      <span class="tap-glow" aria-hidden="true"></span>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
